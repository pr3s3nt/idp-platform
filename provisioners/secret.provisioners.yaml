# `secret` — dùng một Secret CÓ SẴN trong namespace của app.
#
# VÌ SAO CẦN
# Platform đã lo được bí mật do NÓ sinh ra: mật khẩu Postgres, Redis... đi qua
# encodeSecretRef nên manifest trong git chỉ chứa secretKeyRef, không chứa giá trị.
# Nhưng bí mật của RIÊNG app — API key bên thứ ba, token đối tác — thì trước đây không có
# đường nào. Dev chỉ còn cách viết thẳng vào score.yaml, và thế là key đi vào git của app
# LẪN vào manifest trong config repo dưới dạng plaintext. Loại resource này đóng lỗ đó.
#
# CÁCH DÙNG
#   resources:
#     stripe:
#       type: secret
#       params:
#         name: stripe-credentials     # tên Secret trong namespace của app
#         key: api_key                 # khoá bên trong Secret
#   containers:
#     web:
#       variables:
#         STRIPE_API_KEY: "${resources.stripe.value}"
#
# Kết quả render ra secretKeyRef, y hệt cách mật khẩu Postgres được xử lý:
#   - name: STRIPE_API_KEY
#     valueFrom:
#       secretKeyRef: {name: stripe-credentials, key: api_key}
#
# AI TẠO SECRET ĐÓ
# KHÔNG phải platform, và đó là chủ ý. Platform không bao giờ nhìn thấy giá trị. Secret do
# bên sở hữu bí mật đưa vào namespace — Vault + External Secrets Operator, sealed-secrets,
# hoặc đội vận hành tạo tay. Đổi backend không phải sửa gì ở đây: score chỉ nói "tôi cần
# khoá X trong Secret Y", còn Y tới bằng đường nào là chuyện của hạ tầng.
#
# THỨ TỰ QUAN TRỌNG
# Secret phải TỒN TẠI TRƯỚC khi pod khởi động. Thiếu thì pod đứng ở
# CreateContainerConfigError chứ không phải chạy với giá trị rỗng — sai kiểu ồn ào, đúng
# như mong muốn với một API key.
#
# CỐ Ý KHÔNG kiểm tra Secret có tồn tại lúc render: renderer chạy trên runner và không nên
# cần quyền đọc secret của mọi app chỉ để dựng manifest.
- uri: template://custom/existing-secret
  type: secret
  description: Trỏ tới một khoá trong Secret có sẵn ở namespace của app.
  init: |
    {{ if not .Params.name }}{{ fail "secret: thiếu params.name (tên Secret trong namespace)" }}{{ end }}
    {{ if not .Params.key }}{{ fail "secret: thiếu params.key (khoá bên trong Secret)" }}{{ end }}
  outputs: |
    value: {{ encodeSecretRef .Params.name .Params.key }}
  supported_params:
    - name
    - key
  expected_outputs:
    - value
