# `frontend` wires itself to its peers through `type: service` resources, resolved by
# provisioners/service.provisioners.yaml. The resource NAME must match the peer workload
# name — the provisioner takes the last dot-segment of the resource id and looks that up in
# WorkloadServices. This is why every workload has to be generated in ONE score-k8s run.
apiVersion: score.dev/v1b1

metadata:
  name: frontend

containers:
  main:
    image: .
    variables:
      AD_SERVICE_ADDR: "${resources.ad.name}:9555"
      CART_SERVICE_ADDR: "${resources.cart.name}:7070"

service:
  ports:
    http:
      port: 8080
      targetPort: 8080

resources:
  ad:
    type: service
  cart:
    type: service
