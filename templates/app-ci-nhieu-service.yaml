# =============================================================================
# MẪU CI CHO REPO CÓ NHIỀU SERVICE
#
# Chép file này vào .github/workflows/ci.yaml của repo ứng dụng, rồi sửa 4 dòng
# đánh dấu "<-- SỬA" ở khối env bên dưới.
#
# CHỌN ĐÚNG MẪU:
#   - repo có 1 file score.yaml       -> app-ci-mot-service.yaml
#   - repo có nhiều file score.yaml   -> app-ci-nhieu-service.yaml
# Chép nhầm mẫu một-service vào repo nhiều service sẽ hỏng ngay ở bước build với
#   failed to read dockerfile: open Dockerfile: no such file or directory
#
# ⚠️ MẪU NÀY CHƯA TÁCH BUILD VÀ PUSH.
# Nó giả định MỘT máy vừa có internet vừa vào được registry. Nếu mạng công ty chia đôi
# (máy có internet không vào được registry) thì mẫu này KHÔNG chạy được — cần tách thành
# hai job như mẫu một-service. Báo lại để được sửa; đây là việc thật, không phải chỉnh nhỏ,
# vì mỗi service sinh một ảnh riêng nên phải chuyển nhiều tệp qua lại.
#
# NHÃN MÁY CHẠY: hai job chạy trên HAI máy khác nhau khi mạng bị chia đôi —
#   build  cần INTERNET (kéo ảnh nền)
#   push   cần vào được REGISTRY nội bộ
# Nếu một máy làm được cả hai thì khai cùng một nhãn cho cả hai job.
# Sửa giá trị mặc định trong `runs-on` bên dưới cho khớp nhãn runner của bạn.
# =============================================================================
# CI của APP — OnlineBoutique, BUILD THẬT từ source.
#
# Mỗi service một thư mục chứa Dockerfile + score.yaml + code. CI build từng cái bằng chính
# Dockerfile của nó rồi push GHCR.
#
# CHỈ BUILD SERVICE CÓ NỘI DUNG ĐỔI. Tag của mỗi image là mã băm nội dung THƯ MỤC của
# service đó (git tree hash), không phải SHA của cả repo. Sửa `email` thì `frontend` giữ
# nguyên tag -> image đã có sẵn trên registry -> khỏi build, và manifest của nó không đổi
# nên pod không bị khởi động lại.
#
# Đo trước khi sửa: một commit chỉ đụng .github/ vẫn build lại đủ 11 service (~13 phút máy
# chủ) và làm cả 11 Deployment đổi image -> 11 pod restart, kể cả trên production.
#
# Quy tắc đặt tên image do idpctl quyết định, KHÔNG chép lại ở đây: job `plan` gọi
# `idpctl image-plan` để hỏi. Nếu hai bên tự tính riêng rồi lệch nhau thì Fleet sẽ
# apply một manifest trỏ tới image chưa ai push, và chỉ phát hiện được khi pod chết.
name: ci

on:
  push:
    # dev = staging, main = production. Nhánh quyết định môi trường, nên "đưa lên
    # production" là một thao tác git review được chứ không phải một lệnh ai đó gõ.
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP: TEN-APP                      # <-- SỬA
  IMAGE_NAME: TEN-APP               # <-- SỬA (có thể khác APP)
  REGISTRY: harbor.vi-du.vn/idp     # <-- SỬA
  PLATFORM_REPO: TO-CHUC/idp-platform  # <-- SỬA

jobs:
  plan:
    # Nhãn máy chạy đọc từ BIẾN, không gắn cứng. `ubuntu-latest` là runner của
    # GitHub.com — GitHub Enterprise Server KHÔNG có nó, workflow sẽ nằm chờ mãi
    # không ai nhận mà cũng không báo lỗi rõ ràng.
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    outputs:
      # Danh sách service CẦN build (image chưa có trên registry).
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      # CÔNG CỤ CỦA MÁY CHẠY — kiểm TRƯỚC, vì thiếu chúng thì lỗi rơi ra ở giữa một khối
      # bash dài và không nói cho bạn biết phải cài gì. Runner do GitHub cấp luôn có đủ;
      # runner tự dựng — tức MỌI cài đặt GitHub Enterprise Server — thì không có gì đảm bảo.
      # Đo được trên một runner WSL sạch: `pip install` chết vì PEP 668, và ngay sau đó là
      # `jq: command not found` giữa một khối bash dài.
      - name: Kiểm công cụ của máy chạy
        run: |
          set -euo pipefail
          missing=""
          for t in python3 jq docker git; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            echo "::error::máy chạy thiếu:$missing — cài lên runner rồi chạy lại (runner do GitHub cấp thì luôn có sẵn)"
            exit 1
          fi
          # pyyaml: idpctl import nó. `pip install` trên một bản Linux hiện đại bị
          # PEP 668 CHẶN với "error: externally-managed-environment" — runner của GitHub thì
          # không, nên lỗi này chỉ nổ ra ở môi trường thật. Có sẵn thì không cài lại; không
          # có thì thử lần lượt ba cách, cách nào chạy được cũng được.
          if python3 -c 'import yaml' 2>/dev/null; then
            echo "==> pyyaml đã có sẵn"
          else
            pip install --quiet pyyaml \
              || pip install --quiet --user pyyaml \
              || pip install --quiet --break-system-packages pyyaml
            python3 -c 'import yaml'
            echo "==> đã cài pyyaml"
          fi


      # Lấy catalog ở đúng ref app đã ghim, giống hệt cách orchestrator làm — để quy tắc
      # đặt tên mà CI dùng chính là quy tắc sẽ render ra manifest.
      # Vẫn đọc để ghi vào log — orchestrator tự đọc platform.lock từ kho app khi render.
      - name: Resolve catalog version (platform.lock)
        id: lock
        run: |
          REF=$(grep -v '^#' platform.lock 2>/dev/null | head -1 | tr -d '[:space:]')
          [ -n "$REF" ] || REF=main
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PLATFORM_REPO }}
          # LẤY Ở `main`, CỐ Ý — KHÔNG theo platform.lock.
          # platform.lock ghim CATALOG (provisioner, patch) tức DỮ LIỆU, không ghim CODE.
          # Orchestrator luôn chạy idpctl từ nhánh mặc định, vì GitHub chỉ chạy
          # workflow repository_dispatch từ đó. Nếu CI tính tên ảnh bằng một phiên bản
          # idpctl CŨ hơn, hai bên ra hai tên khác nhau ngay khi quy tắc đặt tên
          # đổi — CI đẩy nhãn cũ, manifest đòi nhãn mới, pod ImagePullBackOff. Hôm nay
          # chưa nổ chỉ vì mọi platform.lock đều đang ghi "main".
          ref: main
          token: ${{ secrets.PLATFORM_DISPATCH_TOKEN }}
          path: platform

      - name: Log in to GHCR
        run: echo "${{ secrets.PLATFORM_DISPATCH_TOKEN }}" | docker login "${REGISTRY%%/*}" -u "${{ vars.REGISTRY_USERNAME || github.repository_owner }}" --password-stdin

      - name: Hỏi platform xem phải build image nào
        id: plan
        run: |
          set -euo pipefail
          # KHÔNG khai --tag-strategy: để platform tự quyết theo .idp/stack.yaml, và mặc
          # định về `content` cho kho không có file đó. Phải truyền --env-config, vì chiến
          # lược khai trong .idp/stack.yaml chỉ có hiệu lực khi cờ features.stack_onboarding
          # bật — không có config thì bước này tính ra `content` trong khi orchestrator tính
          # ra `commit`, và hai bên lệch tag nghĩa là Fleet apply một image chưa ai đẩy lên.
          # --with-build: hỏi luôn CÁCH build, không chỉ tên ảnh. Context không phải lúc
          # nào cũng là thư mục chứa Dockerfile — app sinh từ stack có gói dùng chung ở gốc
          # kho, nên `docker build <workload>/` hỏng ngay ở npm install với "shared: not
          # found". Platform biết điều đó (buildContext của component), CI thì không.
          python3 platform/idpctl --env-config platform/platform.env.yaml image-plan \
            --with-build --catalog platform \
            --app "$APP" --image "$IMAGE_NAME" --tag "$GITHUB_SHA" \
            --registry "$REGISTRY" --app-dir . > plan.json
          cat plan.json

          # Chỉ giữ lại những image chưa tồn tại trên registry.
          #
          # Hỏi 3 lần trước khi kết luận là thiếu. Lần chạy đầu tiên của cơ chế này có một
          # service bị build thừa vì `docker manifest inspect` lỗi thoáng qua, trong khi
          # image thật sự đã nằm trên GHCR — kiểm lại thủ công 3/3 lần đều thấy. Coi "lỗi
          # mạng" đồng nghĩa "chưa có image" là sai hướng an toàn (build thừa thì vô hại,
          # nhưng vẫn tốn), nên phân biệt hai thứ đó.
          exists() {
            for _ in 1 2 3; do
              docker manifest inspect "$1" >/dev/null 2>&1 && return 0
              sleep 3
            done
            return 1
          }

          NEED='[]'
          for w in $(jq -r 'keys[]' plan.json); do
            ref=$(jq -r --arg w "$w" '.[$w].image' plan.json)
            ctx=$(jq -r --arg w "$w" '.[$w].context' plan.json)
            df=$(jq  -r --arg w "$w" '.[$w].dockerfile' plan.json)
            if exists "$ref"; then
              echo "  bỏ qua $w — $ref đã có"
            else
              echo "  cần build $w — $ref (context $ctx, dockerfile $df)"
              NEED=$(jq -c --arg w "$w" --arg r "$ref" --arg c "$ctx" --arg d "$df" \
                '. + [{workload:$w, ref:$r, context:$c, dockerfile:$d}]' <<<"$NEED")
            fi
          done
          echo "matrix=$NEED" >> "$GITHUB_OUTPUT"
          echo "count=$(jq 'length' <<<"$NEED")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.PLATFORM_DISPATCH_TOKEN }}" | docker login "${REGISTRY%%/*}" -u "${{ vars.REGISTRY_USERNAME || github.repository_owner }}" --password-stdin

      # RETRY, không phải phòng xa suông: lần chạy đầu tiên của repo này có đúng một service
      # hỏng vì Docker Hub trả 502 Bad Gateway khi kéo base image — cùng service đó build
      # sạch ở máy local vài phút trước. 11 service kéo base image từ 4 registry khác nhau,
      # và một service hỏng là cả deploy không đi tiếp được.
      - name: Build ${{ matrix.workload }}
        run: |
          set -euo pipefail
          REF="${{ matrix.ref }}"
          for attempt in 1 2 3; do
            docker build -f "${{ matrix.dockerfile }}" -t "$REF" \
              "${{ matrix.context }}" && break
            [ "$attempt" = 3 ] && { echo "::error::build ${{ matrix.workload }} hỏng sau 3 lần"; exit 1; }
            echo "::warning::build ${{ matrix.workload }} hỏng (lần $attempt/3) — thử lại sau 20s"
            sleep 20
          done
          for attempt in 1 2 3; do
            docker push "$REF" && break
            [ "$attempt" = 3 ] && { echo "::error::push $REF hỏng sau 3 lần"; exit 1; }
            echo "::warning::push hỏng (lần $attempt/3) — thử lại sau 20s"
            sleep 20
          done
          echo "==> pushed $REF"

  dispatch:
    needs: [plan, build]
    # always() vì `build` bị SKIPPED khi không có service nào đổi — và đó là trường hợp
    # thành công phổ biến nhất, không phải lỗi. Không có always() thì mọi commit chỉ sửa
    # tài liệu sẽ không bao giờ tới được orchestrator.
    if: always() && needs.plan.result == 'success' && needs.build.result != 'failure'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      # Job này chạy trên MÁY KHÁC với job trước (đó là toàn bộ lý do nó tách ra), nên
      # công cụ phải được kiểm lại ở đây.
      - name: Kiểm công cụ của máy chạy
        run: |
          command -v jq >/dev/null 2>&1 || { echo "::error::máy chạy thiếu jq"; exit 1; }

      # GITHUB_TOKEN mặc định KHÔNG dispatch được sang repo khác, nên bắt buộc dùng PAT.
      - name: Dispatch deploy-request tới platform
        env:
          # gh chọn token theo host: github.com đọc GH_TOKEN, host GHES đọc
          # GH_ENTERPRISE_TOKEN. Set cả hai bằng CÙNG một secret để chạy đúng ở cả hai loại
          # host mà không phải biết trước đang ở đâu. Thừa một biến ở host kia là vô hại.
          GH_TOKEN: ${{ secrets.PLATFORM_DISPATCH_TOKEN }}
          GH_ENTERPRISE_TOKEN: ${{ secrets.PLATFORM_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          # gh với đường dẫn tương đối mặc định gọi github.com; trên GHES token GHES bị trả
          # 401. Ép gh gọi đúng host của lần chạy này qua GITHUB_SERVER_URL (Actions luôn đặt:
          # github.com -> "github.com", GHES -> host công ty). Bỏ scheme vì GH_HOST cần host trần.
          export GH_HOST="${GITHUB_SERVER_URL#https://}"
          # Nhánh quyết định môi trường đích.
          DEPLOY_ENV=staging
          [ "$GITHUB_REF_NAME" = "main" ] && DEPLOY_ENV=prod
          echo "==> nhánh $GITHUB_REF_NAME -> môi trường $DEPLOY_ENV"
          jq -n \
            --arg app   "$APP" \
            --arg denv  "$DEPLOY_ENV" \
            --arg repo  "$GITHUB_REPOSITORY" \
            --arg sha   "$GITHUB_SHA" \
            --arg image "$IMAGE_NAME" \
            '{event_type:"deploy-request",
              client_payload:{app:$app, repo:$repo, sha:$sha, image:$image,
                              env:$denv}}' \
          | gh api -X POST "/repos/${PLATFORM_REPO}/dispatches" --input -
          echo "==> deploy-request đã gửi (đã build ${{ needs.plan.outputs.count }} service)"
