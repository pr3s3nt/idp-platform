# nginx PHỤC VỤ BUNDLE TĨNH của __WORKLOAD__ — không phải reverse proxy.
#
# Đừng thêm `location /api { proxy_pass ... }` vào đây. Việc ghép `/` và `/api` vào một
# origin là của platform: trên cụm là HTTPRoute của Gateway, ở local là nginx dùng chung do
# score-compose dựng. Làm lần nữa ở đây nghĩa là có hai nơi định nghĩa routing, và cái ở
# đây chỉ đúng cho local nên staging sẽ cư xử khác.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Asset có hash trong tên nên cache dài được; index.html thì không.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: mọi đường dẫn không phải file có thật đều trả index.html, để router
    # phía trình duyệt xử lý. KHÔNG ảnh hưởng `/api` — request đó không bao giờ tới
    # container này, nginx same-origin đã tách từ trước.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
