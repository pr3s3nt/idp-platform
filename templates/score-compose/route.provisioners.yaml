# `route` cho PHÁT TRIỂN LOCAL (score-compose) — same-origin routing bằng một nginx dùng chung.
#
# VÌ SAO KHÔNG DÙNG PROVISIONER MẶC ĐỊNH CỦA score-compose
# Bản mặc định gom mọi route CÙNG MỘT host vào một server block — đúng ý tưởng same-origin.
# Nhưng nó xếp các `location` theo thứ tự khoá của map shared, mà khoá đó là `.Uid`, tức là
# TÊN WORKLOAD. nginx chọn location regex ĐẦU TIÊN khớp, nên thứ tự quyết định kết quả:
#
#   frontend `path: /`   ->  location ~ ^/.*      (bắt tất cả)
#   backend  `path: /api`->  location ~ ^/api/.*
#
# Đặt tên workload là `backend`/`frontend` thì "backend" < "frontend", `/api` nằm trước và
# mọi thứ chạy. Đổi tên thành `orders`/`app-ui` thì "app-ui" < "orders", `^/.*` lên trước và
# **mọi request /api/... rơi vào frontend** — API trả về trang HTML. Đã đo thật, không suy luận.
#
# Đó là lỗi im lặng đúng kiểu dự án này sợ nhất: không có thông báo, chỉ có API trả sai, và
# nó phụ thuộc vào một thứ không ai nghĩ là có ý nghĩa (thứ tự chữ cái của tên workload).
#
# Tệ hơn: trên Kubernetes, catalog sinh HTTPRoute với `type: PathPrefix`, mà Gateway API
# xếp hạng theo ĐỘ DÀI PREFIX (dài hơn thắng) chứ không theo thứ tự khai báo. Nên bản mặc
# định làm local và staging cư xử KHÁC NHAU — đúng thứ mà `make dev` sinh ra để loại bỏ.
#
# CÁCH SỬA: khoá của map shared không còn là `.Uid` mà là `<999-len(path)>-<Uid>`. Go
# template duyệt map theo thứ tự khoá đã sắp, nên path DÀI NHẤT ra trước — cùng quy tắc
# ưu tiên với Gateway API. `/api` (len 4 -> 995) luôn đứng trước `/` (len 1 -> 998), bất kể
# workload tên gì.
- uri: template://platform/route-same-origin
  type: route
  description: Same-origin routing local qua một nginx dùng chung, ưu tiên theo độ dài path.
  init: |
    randomServiceName: routing-{{ randAlphaNum 6 }}
    sk: platform-route-same-origin
    {{ if not (regexMatch "^/|(/([^/]+))+$" .Params.path) }}{{ fail "params.path phải bắt đầu bằng / và không kết thúc bằng /" }}{{ end }}
    {{ if not (regexMatch "^[a-z0-9_.-]{1,253}$" .Params.host) }}{{ fail (cat "params.host không hợp lệ:" .Params.host) }}{{ end }}
    {{ $ports := (index .WorkloadServices .SourceWorkload).Ports }}
    {{ if not $ports }}{{ fail "workload chưa có service ports" }}{{ end }}
    {{ $port := index $ports (print .Params.port) }}
    {{ if not $port.TargetPort }}{{ fail "params.port không phải cổng service hợp lệ" }}{{ end }}
  shared: |
    {{ .Init.sk }}:
      instancePort: {{ dig .Init.sk "instancePort" 8080 .Shared }}
      instanceServiceName: {{ dig .Init.sk "instanceServiceName" .Init.randomServiceName .Shared | quote }}
      {{ $targetHost := (index .WorkloadServices .SourceWorkload).ServiceName }}
      {{ $ports := (index .WorkloadServices .SourceWorkload).Ports }}
      {{ $port := index $ports (print .Params.port) }}
      {{ $target := (printf "%s:%d" $targetHost $port.TargetPort) }}
      {{ $hBefore := dig .Init.sk "hosts" (dict) .Shared }}
      {{ $rBefore := dig .Params.host (dict) $hBefore }}
      {{/* ĐÂY là chỗ sửa lỗi: khoá mang sẵn thứ hạng ưu tiên, không phải tên workload.
           999 - độ dài path, đệm 3 chữ số, rồi mới tới Uid để phá hoà (ổn định, không ngẫu nhiên). */}}
      {{ $rank := printf "%03d-%s" (sub 999 (len .Params.path)) .Uid }}
      {{ $inner := dict "path" .Params.path "target" $target }}
      {{ $rAfter := (merge $rBefore (dict $rank $inner)) }}
      {{ $hAfter := (merge $hBefore (dict .Params.host $rAfter)) }}
      hosts: {{ $hAfter | toRawJson }}
  files: |
    {{ dig .Init.sk "instanceServiceName" "" .Shared }}/nginx.conf: |
      worker_processes 1;
      worker_rlimit_nofile 8192;
      events {
        worker_connections 4096;
      }
      http {
        # Resolver nội bộ của Docker: tên service được phân giải LÚC CHẠY, nên nginx khởi
        # động được kể cả khi backend chưa lên — không thì cả `make dev` chết theo thứ tự bật.
        #
        # `valid=5s` LÀ BẮT BUỘC, KHÔNG PHẢI TINH CHỈNH. Không có nó, nginx giữ kết quả DNS
        # theo TTL của Docker (600s). Mỗi lần `docker compose up --build` dựng lại container
        # thì workload nhận IP MỚI, còn nginx vẫn đẩy request tới IP CŨ — API trả 502 suốt
        # 10 phút trong khi container đích đang chạy và log của nó hoàn toàn sạch.
        # Đã đo: DNS trả 172.19.0.5, nginx vẫn gọi 172.19.0.4, và chỉ restart nginx mới hết.
        # Đúng vòng lặp mà `make dev` được dùng nhiều nhất — sửa mã, build lại, thử lại.
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 5s;

        {{ range $h, $r := (dig .Init.sk "hosts" "" .Shared) }}
        server {
          listen 80;
          listen [::]:80;
          server_name {{ $h }};

          proxy_set_header X-Real-IP        $remote_addr;
          proxy_set_header X-Forwarded-For  $remote_addr;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header Host             $host;
          proxy_set_header Proxy            "";
          proxy_connect_timeout             5s;
          proxy_send_timeout                60s;
          proxy_read_timeout                60s;
          proxy_buffers                     16 4k;
          proxy_buffer_size                 2k;
          client_max_body_size              10m;

          location = /favicon.ico {
            return 204;
            access_log     off;
            log_not_found  off;
          }

          {{/* Duyệt theo khoá đã sắp: path dài nhất trước, giống Gateway API PathPrefix. */}}
          {{ range $rank, $v := $r }}
          # {{ $rank }} -> {{ index $v "path" }}
          location = {{ index $v "path" }} {
            set $backend {{ index $v "target" }};
            proxy_pass http://$backend;
          }
          location ~ ^{{ index $v "path" | trimSuffix "/" }}/ {
            set $backend {{ index $v "target" }};
            proxy_pass http://$backend;
          }
          {{ end }}
        }
        {{ end }}
      }
  services: |
    {{ $p := (dig .Init.sk "instancePort" 0 .Shared) }}
    {{ dig .Init.sk "instanceServiceName" "" .Shared }}:
      image: %%images.nginx%%
      restart: always
      ports:
        - published: {{ $p }}
          target: 80
      volumes:
        - type: bind
          source: {{ .MountsDirectory }}/{{ dig .Init.sk "instanceServiceName" "" .Shared }}/nginx.conf
          target: /etc/nginx/nginx.conf
          readOnly: true
  info_logs: |
    {{ $p := (dig .Init.sk "instancePort" 0 .Shared) }}
    - "{{ .Uid }}: mở http://{{ .Params.host }}:{{ $p }}{{ .Params.path }} (host này phải phân giải về localhost)"
  supported_params:
    - host
    - port
    - path
