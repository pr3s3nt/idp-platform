# =============================================================================
# CẤU HÌNH MÔI TRƯỜNG CÔNG TY
#
# Dùng bằng: orchestrate.py --env-config platform.env.company.yaml <lệnh>
# Sandbox vẫn dùng platform.env.yaml, hai file chạy song song không đụng nhau.
#
# ✅ = đã có thông tin xác nhận
# ❓ = còn thiếu. Giá trị tạm cố tình đặt dạng *.invalid và todo-* để nếu quên điền thì
#     hỏng NGAY và rõ ràng, chứ không âm thầm deploy vào nhầm chỗ.
# =============================================================================

git:
  org: example-org                        # ✅ đã khảo sát GHES 3.18.12
  # ❓ Quy ước đặt tên repo cấu hình. Ví dụ "{app}-config" hoặc "platform-{app}-config".
  config_repo_pattern: "{app}-config"
  default_branch: main
  # Kho ỨNG DỤNG mà onboarding tạo (mã nguồn), tách khỏi kho CẤU HÌNH (manifest).
  # Hai kho, hai vòng đời, hai bộ quyền: đội ứng dụng ghi kho thứ nhất, chỉ orchestrator
  # ghi kho thứ hai.
  app_repo_pattern: "{app}"
  # Kho platform mà CI của app checkout để HỎI tên ảnh phải build. Điền sai thì CI tính
  # tên ảnh bằng một quy tắc khác orchestrator và Fleet apply một ảnh chưa ai đẩy lên.
  platform_repo: "example-org/idp-platform"
  # ✅ CÂU 3: công ty cho phép bot/GitHub App bypass branch protection.
  # Nhờ vậy staging ghi thẳng được, không phải mở PR cho từng lần deploy.
  bot_can_bypass: true
  # Danh tính ghi trên commit mà orchestrator tạo ra.
  # CẢNH BÁO: KHÔNG dùng đuôi @users.noreply.github.com. GitHub map đuôi đó về
  # username tương ứng, nên nếu username đó tồn tại thật thì mọi commit triển khai
  # sẽ bị ghi công cho một người lạ — đúng chuyện đã xảy ra với ci-bot@ ở sandbox.
  # Khi có GitHub App, đổi sang email chính thức của App đó.
  committer_name: idp-orchestrator
  committer_email: idp-orchestrator@noreply.invalid

# ---------------------------------------------------------------------------
# ONBOARDING (Phase 6) — máy trạng thái tạo app mới.
#
# Bản ghi state nằm trong một ConfigMap ở kubernetes.state_namespace. CỐ Ý không phải
# Secret: bản ghi này không chứa giá trị bí mật nào, chỉ tên đường dẫn Vault, tên kho và
# tên ảnh. Cất vào Secret là dạy người đọc rằng trong đó có bí mật.
# ---------------------------------------------------------------------------
onboarding:
  state_configmap_pattern: "idp-onboarding-{app}"
  # Mức hiển thị routing được phép trong request. Catalog này có đúng MỘT Gateway nội bộ.
  # Muốn có `public` thì phải có một Gateway public thật + khai vào ingress.*, rồi mới
  # thêm tên đó vào đây — không nới ở code.
  visibilities: ["internal"]
  # Đội nào được phép onboard. RỖNG = ai cũng được, hợp cho harness. Công ty nên liệt kê.
  allowed_owners: []
  # `verify` của bước VERIFYING_STAGING/VERIFYING_PROD chờ bao lâu. Rộng hơn deploy thường
  # vì lần đầu còn phải kéo ảnh nền và bootstrap database.
  verify_timeout_seconds: 420

registry:
  host: harbor.stg.exampledevops.com      # ✅ đã xác nhận, HTTPS
  # ĐỀ XUẤT tên project là `idp`. Đổi nếu công ty có quy ước khác.
  path: harbor.stg.exampledevops.com/idp  # ⚠️ chờ xác nhận tên project
  pull_secret: registry-pull              # tên secret do platform tự tạo, đặt gì cũng được

kubernetes:
  state_namespace: cluster-state          # ❓ xác nhận có được phép tạo namespace này không
  namespace_pattern: "{app}-{env}"        # ❓ xác nhận khớp quy ước công ty
  # ✅ CÂU 3: cụm có 2 StorageClass — local-blk (kubernetes.io/no-provisioner) và
  # rook-ceph-block (rook-ceph.rbd.csi.ceph.com, đang là default).
  # Chọn rook-ceph-block: Postgres cần ổ đĩa mạng gắn lại được khi pod chuyển node.
  # local-blk là no-provisioner, tức phải khai PersistentVolume bằng tay và ổ đĩa dính
  # chặt vào một node — pod chuyển node là mất dữ liệu. KHÔNG dùng cho datastore.
  storage_class: rook-ceph-block
  sha_record_dir: .platform
  # Namespace chứa GitRepo của Fleet. Rancher thường dùng fleet-local cho cụm local và
  # fleet-default cho cụm downstream — khai SAI thì Fleet không nhận mà cũng không báo lỗi.
  fleet_namespace: fleet-local
  # Secret chứa thông tin đăng nhập git để Fleet clone repo cấu hình TỪ TRONG cụm.
  # Phải là tài khoản ĐỌC ĐƯỢC repo cấu hình, nếu không GitRepo đứng im.
  fleet_git_secret: ""        # để trống: học theo GitRepo đang chạy trên cụm
  # Hậu tố DNS nội bộ của cụm. Dùng để một app gọi service của app KHÁC
  # nằm ở namespace khác (xem resource type external-service).
  cluster_domain: svc.cluster.local

# ---------------------------------------------------------------------------
# Máy chạy CI. Nhãn KHÔNG đọc được từ file khi workflow tự khai `runs-on` — GitHub chọn
# máy trước khi chạy bước đầu tiên. Nhưng workflow verify nằm trong KHO CẤU HÌNH lại do
# platform sinh ra, nên nhãn của nó lấy được từ đây.
# ---------------------------------------------------------------------------
ci:
  # Job verify chỉ gọi API GitHub — không cần Docker, không cần vào cụm — nên dùng máy
  # dùng chung của công ty, không chiếm runner riêng của platform.
  # Một nhãn thì viết chuỗi; nhiều nhãn thì viết danh sách.
  verify_runner_label: [code-linux, code-default]

  # ❓ PHẢI KIỂM khi mang vào công ty: cài đúng hai phiên bản này lên runner
  # platform-orchestrator, rồi chạy `orchestrate.py preflight`. Nếu runner của công ty
  # đã cố định một phiên bản khác thì SỬA HAI DÒNG NÀY cho khớp và chạy lại full test
  # suite — đừng để trống để né kiểm tra, vì lệch phiên bản score-k8s làm manifest đổi
  # hình dạng mà không có lỗi nào.
  # Giá trị dưới đây là phiên bản đã kiểm chứng trên harness WSL2.
  score_k8s_version: "0.15.0"
  score_compose_version: "0.43.0"

# ---------------------------------------------------------------------------
# HASHICORP VAULT
# ❓ CHƯA XÁC NHẬN: công ty đã có Vault, nhưng còn phải hỏi Vault Ops đúng 4 điều:
#   1. Tên KV mount dành cho platform (dưới đây giả định `kv`) và nó là v1 hay v2.
#   2. Auth mount kubernetes cho cụm này (VaultAuth trỏ vào, xem Phase 2).
#   3. Platform có được tự tạo policy theo tiền tố apps/<app>/<env>/* hay phải xin.
#   4. Phiên bản VSO được duyệt cài lên cụm.
# Sai kv_mount thì VSO báo permission denied chứ không phải "không tìm thấy" — dễ tưởng
# nhầm là thiếu quyền trong khi thật ra sai đường dẫn.
# ---------------------------------------------------------------------------
vault:
  operator_version: "1.5.0"               # ❓ chờ Vault Ops duyệt phiên bản
  address: ""                             # ❗ BẮT BUỘC điền: địa chỉ Vault CỤM gọi được
  namespace: ""                           # ❓ Vault Enterprise namespace, OSS thì để rỗng
  skip_tls_verify: false                  # công ty phải là false
  ca_cert_secret: ""                      # ❓ tên Secret chứa ca.crt trong ns của VSO
  tls_server_name: ""
  kv_mount: kv                            # ❓ chờ xác nhận tên mount
  kv_type: kv-v2                          # ❓ chờ xác nhận v1 hay v2
  path_template: "apps/{application}/{environment}/{name}"
  auth_mount: kubernetes                  # ❓ chờ xác nhận auth mount của CỤM NÀY
  auth_audience: vault                    # ❓ phải khớp audience cấu hình trong Vault role
  auth_role_template: "idp-{application}-{environment}"     # ❓ quy ước đặt tên của Vault Ops
  policy_template: "idp-{application}-{environment}"        # ❓ như trên
  service_account_template: "idp-{application}"
  token_ttl: 1h
  operator_namespace: vault-secrets-operator-system
  connection_name: default
  auth_global_name: default
  allowed_namespaces: []                  # ❓ nhiều đội thì liệt kê tường minh
  auth_ref: app-vault
  refresh_after: 5m
  initial_sync_timeout_seconds: 60

# ---------------------------------------------------------------------------
# HỒ SƠ DATABASE
# ❓ CHƯA XÁC NHẬN: số bản sao, dung lượng và retention của prod phải do DBA chốt.
# Giá trị dưới đây là ĐỀ XUẤT, không phải cam kết. engine_version của staging và prod
# BẮT BUỘC giống nhau — đừng sửa lệch để tiết kiệm tài nguyên staging.
# ---------------------------------------------------------------------------
database:
  # ✅ Discovery database.yaml: cụm KHÔNG có CNPG operator và công ty không yêu cầu CNPG.
  # Backend statefulset = PostgreSQL StatefulSet do platform quản (một bản sao, không HA,
  # không backup nội tại — render prod bị CHẶN cho tới khi có backup backend). Staging chạy
  # được bình thường. Bộ output app nhận giống hệt backend cnpg, nên không fork code app.
  backend: statefulset
  provider: cloudnative-pg               # (không dùng khi backend=statefulset)
  operator_version: "0.29.0"             # (không dùng khi backend=statefulset)
  operator_namespace: cnpg-system        # (không dùng khi backend=statefulset)
  # ✅ backend statefulset cần ảnh postgres THƯỜNG (không phải ảnh CNPG). Đã mirror về Harbor.
  # image = image_repository:engine_version, nên major version chỉ khai một chỗ (profile).
  image_repository: "harbor.stg.exampledevops.com/base/postgres"
  storage_class: ""                      # rỗng = dùng kubernetes.storage_class (rook-ceph-block)
  credential_secret: database
  ready_timeout_seconds: 600
  backup:
    object_store_url: ""                 # ❗ BẮT BUỘC cho prod: render prod bị chặn nếu rỗng
    # Địa chỉ kho object khi nó KHÔNG phải AWS S3 (MinIO, Ceph, kho nội bộ). Rỗng = AWS.
    # Sai/thiếu thì WAL archiving hỏng trong im lặng: cluster vẫn Ready mà không phục hồi được.
    endpoint_url: ""                     # ❓ điền nếu công ty dùng kho S3-compatible nội bộ
    credentials_secret: ""               # ❓ Secret chứa ACCESS_KEY_ID/ACCESS_SECRET_KEY
    destination_path: ""
    # LỊCH CHỤP BASE BACKUP. `object_store_url` một mình chỉ bật WAL archiving; WAL không
    # có base backup thì KHÔNG phục hồi được gì, dù cụm báo `ContinuousArchiving=True`.
    # CRON CỦA CNPG CÓ SÁU TRƯỜNG (giây đứng đầu) — "0 2 * * *" kiểu Unix bị đọc thành
    # "chụp mỗi giờ". Rỗng + có kho object = render bị chặn.
    schedule: "0 0 2 * * *"              # ❓ xác nhận cửa sổ bảo trì với DBA
    first_backup_timeout_seconds: 600

database_profiles:
  staging:
    application:
      engine_version: "17"                # ❓ xác nhận major version DBA hỗ trợ
      instances: 1
      storage: 10Gi
      cpu_request: 250m
      memory_request: 512Mi
      high_availability: false
      backup:
        enabled: true
        retention_days: 3
  prod:
    application:
      engine_version: "17"                # PHẢI trùng staging
      instances: 3                        # ❓ xác nhận với DBA
      storage: 100Gi                      # ❓ xác nhận hạn mức rook-ceph
      cpu_request: "1"
      memory_request: 2Gi
      high_availability: true
      backup:
        enabled: true
        retention_days: 30                # ❓ xác nhận chính sách lưu trữ
        point_in_time_recovery: true

# ---------------------------------------------------------------------------
# CỜ TÍNH NĂNG — mang code vào công ty với TẤT CẢ đang tắt.
# Bật từng cái một, cho một app pilot, sau khi app cũ đã xác minh chạy y như trước.
# ---------------------------------------------------------------------------
features:
  application_values: false
  vault_secrets: false
  postgres_application: false
  stack_onboarding: false

ingress:
  # ✅ CÂU 2: Gateway API, Gateway tên traefik-gateway ở namespace traefik,
  # PROGRAMMED=True, đã chạy 20 ngày.
  gateway_name: traefik-gateway
  gateway_namespace: traefik
  # ✅ Discovery gateway.yaml: Gateway có 2 listener — web (HTTP/80) và websecure
  # (HTTPS/443, TLS Terminate). Không khai sectionName thì route attach nhầm vào listener
  # HTTP (GATEWAY-06). Chọn websecure để đi qua HTTPS, khớp các HTTPRoute hiện có (GATEWAY-07).
  section_name: websecure
  # Gateway terminate TLS ở websecure -> URL người dùng là https.
  route_scheme: https

images:
  # ❓ Đường dẫn ảnh Postgres trên Harbor. Cụm on-prem thường không ra được internet
  # nên phải mirror sẵn, không kéo thẳng từ Docker Hub.
  # ĐỀ XUẤT để ảnh của bên thứ ba ở project RIÊNG: vòng đời khác, quyền khác,
  # và robot đẩy ảnh ứng dụng không nên ghi đè được ảnh nền dùng chung.
  postgres: harbor.stg.exampledevops.com/base/postgres:17-alpine  # ⚠️ chờ xác nhận
  # ❓ Ảnh nền của golden path `node-fullstack` và của `make dev` (Phase 5).
  # Hai ảnh này đi vào Dockerfile SINH RA CHO KHO ỨNG DỤNG, nên MÁY LẬP TRÌNH VIÊN cũng
  # phải kéo được, không chỉ runner CI. Nếu máy dev không vào được Harbor nội bộ thì
  # `make dev` hỏng ngay ở bước build đầu tiên — hỏi trước, đừng để phát hiện lúc onboarding.
  node: harbor.stg.exampledevops.com/base/node:22-alpine     # ⚠️ chờ xác nhận + mirror
  nginx: harbor.stg.exampledevops.com/base/nginx:1-alpine    # ⚠️ chờ xác nhận + mirror

environments:
  staging:
    # Nhánh của REPO CẤU HÌNH mà môi trường này đọc.
    # Nhánh của repo cấu hình. CÓ CẦN DUYỆT HAY KHÔNG thì KHÔNG khai ở đây —
    # orchestrator hỏi thẳng branch protection của nhánh này. Một cờ trong file
    # và một cấu hình thật trên GitHub là hai nguồn sự thật, chắc chắn có lúc lệch.
    config_branch: dev
    replicas: 1
    domain: stg.exampledevops.com          # ✅ đã xác nhận
    cpu_request: 50m
    memory_request: 64Mi
    memory_limit: 256Mi
  prod:
    config_branch: main
    replicas: 3                            # ❓ xác nhận số bản sao tối thiểu cho prod
    domain: prod.todo.invalid              # ❓ CHƯA CÓ — cụm production đang dựng
    cpu_request: 100m
    memory_request: 128Mi
    memory_limit: 512Mi

# =============================================================================
# GHI CHÚ VỀ BRANCH PROTECTION (câu 1) — CHƯA XỬ LÝ ĐƯỢC BẰNG CẤU HÌNH
#
# Mọi nhánh đều bảo vệ, merge phải qua pull request. Orchestrator hiện PUSH THẲNG vào
# repo cấu hình, nên sẽ bị từ chối. Đây là thay đổi CODE chứ không phải cấu hình.
#
# Còn thiếu 3 thông tin để chọn đúng cách sửa — xem phần trả lời kèm theo.
# =============================================================================
