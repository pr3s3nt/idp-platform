# =============================================================================
# CẤU HÌNH MÔI TRƯỜNG CÔNG TY
#
# Dùng bằng: orchestrate.py --env-config platform.env.company.yaml <lệnh>
# Sandbox vẫn dùng platform.env.yaml, hai file chạy song song không đụng nhau.
#
# ✅ = đã có thông tin xác nhận
# ❓ = còn thiếu. Giá trị tạm cố tình đặt dạng *.invalid và todo-* để nếu quên điền thì
#     hỏng NGAY và rõ ràng, chứ không âm thầm deploy vào nhầm chỗ.
# =============================================================================

git:
  org: example-org                        # ✅ đã khảo sát GHES 3.18.12
  # ❓ Quy ước đặt tên repo cấu hình. Ví dụ "{app}-config" hoặc "platform-{app}-config".
  config_repo_pattern: "{app}-config"
  default_branch: main
  # ✅ CÂU 3: công ty cho phép bot/GitHub App bypass branch protection.
  # Nhờ vậy staging ghi thẳng được, không phải mở PR cho từng lần deploy.
  bot_can_bypass: true
  # Danh tính ghi trên commit mà orchestrator tạo ra.
  # CẢNH BÁO: KHÔNG dùng đuôi @users.noreply.github.com. GitHub map đuôi đó về
  # username tương ứng, nên nếu username đó tồn tại thật thì mọi commit triển khai
  # sẽ bị ghi công cho một người lạ — đúng chuyện đã xảy ra với ci-bot@ ở sandbox.
  # Khi có GitHub App, đổi sang email chính thức của App đó.
  committer_name: idp-orchestrator
  committer_email: idp-orchestrator@noreply.invalid

registry:
  host: harbor.stg.exampledevops.com      # ✅ đã xác nhận, HTTPS
  # ĐỀ XUẤT tên project là `idp`. Đổi nếu công ty có quy ước khác.
  path: harbor.stg.exampledevops.com/idp  # ⚠️ chờ xác nhận tên project
  pull_secret: registry-pull              # tên secret do platform tự tạo, đặt gì cũng được

kubernetes:
  state_namespace: cluster-state          # ❓ xác nhận có được phép tạo namespace này không
  namespace_pattern: "{app}-{env}"        # ❓ xác nhận khớp quy ước công ty
  # ✅ CÂU 3: cụm có 2 StorageClass — local-blk (kubernetes.io/no-provisioner) và
  # rook-ceph-block (rook-ceph.rbd.csi.ceph.com, đang là default).
  # Chọn rook-ceph-block: Postgres cần ổ đĩa mạng gắn lại được khi pod chuyển node.
  # local-blk là no-provisioner, tức phải khai PersistentVolume bằng tay và ổ đĩa dính
  # chặt vào một node — pod chuyển node là mất dữ liệu. KHÔNG dùng cho datastore.
  storage_class: rook-ceph-block
  sha_record_dir: .platform
  # Namespace chứa GitRepo của Fleet. Rancher thường dùng fleet-local cho cụm local và
  # fleet-default cho cụm downstream — khai SAI thì Fleet không nhận mà cũng không báo lỗi.
  fleet_namespace: fleet-local
  # Secret chứa thông tin đăng nhập git để Fleet clone repo cấu hình TỪ TRONG cụm.
  # Phải là tài khoản ĐỌC ĐƯỢC repo cấu hình, nếu không GitRepo đứng im.
  fleet_git_secret: ""        # để trống: học theo GitRepo đang chạy trên cụm
  # Hậu tố DNS nội bộ của cụm. Dùng để một app gọi service của app KHÁC
  # nằm ở namespace khác (xem resource type external-service).
  cluster_domain: svc.cluster.local

ingress:
  # ✅ CÂU 2: Gateway API, Gateway tên traefik-gateway ở namespace traefik,
  # PROGRAMMED=True, đã chạy 20 ngày.
  gateway_name: traefik-gateway
  gateway_namespace: traefik

images:
  # ❓ Đường dẫn ảnh Postgres trên Harbor. Cụm on-prem thường không ra được internet
  # nên phải mirror sẵn, không kéo thẳng từ Docker Hub.
  # ĐỀ XUẤT để ảnh của bên thứ ba ở project RIÊNG: vòng đời khác, quyền khác,
  # và robot đẩy ảnh ứng dụng không nên ghi đè được ảnh nền dùng chung.
  postgres: harbor.stg.exampledevops.com/base/postgres:17-alpine  # ⚠️ chờ xác nhận

environments:
  staging:
    # Nhánh của REPO CẤU HÌNH mà môi trường này đọc.
    # Nhánh của repo cấu hình. CÓ CẦN DUYỆT HAY KHÔNG thì KHÔNG khai ở đây —
    # orchestrator hỏi thẳng branch protection của nhánh này. Một cờ trong file
    # và một cấu hình thật trên GitHub là hai nguồn sự thật, chắc chắn có lúc lệch.
    config_branch: dev
    replicas: 1
    domain: stg.exampledevops.com          # ✅ đã xác nhận
    cpu_request: 50m
    memory_request: 64Mi
    memory_limit: 256Mi
  prod:
    config_branch: main
    replicas: 3                            # ❓ xác nhận số bản sao tối thiểu cho prod
    domain: prod.todo.invalid              # ❓ CHƯA CÓ — cụm production đang dựng
    cpu_request: 100m
    memory_request: 128Mi
    memory_limit: 512Mi

# =============================================================================
# GHI CHÚ VỀ BRANCH PROTECTION (câu 1) — CHƯA XỬ LÝ ĐƯỢC BẰNG CẤU HÌNH
#
# Mọi nhánh đều bảo vệ, merge phải qua pull request. Orchestrator hiện PUSH THẲNG vào
# repo cấu hình, nên sẽ bị từ chối. Đây là thay đổi CODE chứ không phải cấu hình.
#
# Còn thiếu 3 thông tin để chọn đúng cách sửa — xem phần trả lời kèm theo.
# =============================================================================
