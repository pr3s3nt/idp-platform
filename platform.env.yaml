# =============================================================================
# CẤU HÌNH MÔI TRƯỜNG — nơi DUY NHẤT chứa giá trị phụ thuộc hạ tầng.
#
# Chuyển platform sang môi trường khác = sửa file này. Không sửa code, không sửa
# provisioner, không sửa patch, không sửa workflow.
#
# KHÔNG ghim theo platform.lock, và đó là chủ ý. platform.lock ghim CATALOG — tức cách
# một resource được hiện thực hoá (route thành HTTPRoute, postgres thành StatefulSet).
# File này là TOẠ ĐỘ của hạ tầng đang chạy (gateway nào, storageclass nào). Nếu ghim nó
# theo lock, một app pin catalog cũ sẽ deploy vào tên Gateway đã bị đổi từ lâu — mà lỗi
# đó lại không báo gì, HTTPRoute chỉ đơn giản là không bao giờ được gắn vào.
#
# Cách dùng trong provisioner và patch: %%đường.dẫn.khoá%%
#   %%ingress.gateway_name%%     -> giá trị dùng chung
#   %%env.replicas%%             -> giá trị của môi trường ĐANG render (staging/prod)
#
# KHÔNG để bí mật ở đây. File này nằm trong git. Token, mật khẩu đi qua secret của CI.
# =============================================================================

git:
  org: pr3s3nt
  config_repo_pattern: "idp-{app}-config"
  default_branch: main
  # Bot có được phép bỏ qua branch protection không. Quyết định cách ghi vào repo cấu hình
  # cho những môi trường KHÔNG bắt duyệt: true -> push thẳng, false -> vẫn phải mở PR.
  bot_can_bypass: true
  # Danh tính ghi trên commit mà orchestrator tạo ra.
  # CẢNH BÁO: KHÔNG dùng đuôi @users.noreply.github.com. GitHub map đuôi đó về
  # username tương ứng, nên nếu username đó tồn tại thật thì mọi commit triển khai
  # sẽ bị ghi công cho một người lạ — đúng chuyện đã xảy ra với ci-bot@ ở sandbox.
  # Khi có GitHub App, đổi sang email chính thức của App đó.
  # Danh tính CHÍNH THỨC của GitHub App idp-orchestrator-pr3s3nt.
  # Đuôi @users.noreply.github.com ở đây là ĐÚNG — nó ánh xạ về chính con bot này.
  # Khác hẳn giá trị cũ ci-bot@users.noreply.github.com, vốn ánh xạ nhầm sang một
  # người dùng GitHub có thật, không liên quan gì tới dự án.
  committer_name: "idp-orchestrator-pr3s3nt[bot]"
  committer_email: "311388152+idp-orchestrator-pr3s3nt[bot]@users.noreply.github.com"

registry:
  # Host dùng cho docker login và cho imagePullSecret.
  host: ghcr.io
  # Tiền tố đầy đủ của ảnh: <path>/<image>:<tag>
  path: ghcr.io/pr3s3nt
  # Secret kiểu dockerconfigjson mà platform tự tạo trong mỗi namespace.
  pull_secret: registry-pull

kubernetes:
  # Namespace giữ trạng thái của bộ sinh manifest (một Secret cho mỗi app+env).
  state_namespace: cluster-state
  # Namespace của ứng dụng.
  namespace_pattern: "{app}-{env}"
  # Tên StorageClass mà provisioner có trạng thái (postgres) xin ổ đĩa.
  # SAI TÊN = PVC treo Pending vĩnh viễn, không có thông báo lỗi rõ ràng.
  storage_class: storage-class
  # Thư mục trong repo cấu hình ghi lại SHA đang deploy. Để ngoài staging/ và prod/
  # để Fleet không coi nó là manifest.
  sha_record_dir: .platform
  # Hậu tố DNS nội bộ của cụm. Dùng để một app gọi service của app KHÁC
  # nằm ở namespace khác (xem resource type external-service).
  cluster_domain: svc.cluster.local

ingress:
  # PHẢI khớp chính xác Gateway đang chạy trên cụm. Sai tên hoặc sai namespace thì
  # HTTPRoute không bao giờ được attach — và không có lỗi ở đâu cả.
  gateway_name: ingress-gateway
  gateway_namespace: traefik

images:
  # Ảnh của các datastore do provisioner dựng. Trên môi trường thật, trỏ vào registry
  # nội bộ vì cụm thường không ra được internet.
  postgres: ghcr.io/pr3s3nt/postgres:17-alpine

# ---------------------------------------------------------------------------
# Khác biệt giữa các môi trường. Khi render, khối tương ứng được phơi ra dưới
# tiền tố `env.` — ví dụ %%env.replicas%%, %%env.domain%%.
# ---------------------------------------------------------------------------
environments:
  staging:
    # Mô hình hai nhánh, khớp cách công ty tổ chức: dev = staging, main = production.
    config_branch: dev
    require_pr: false
    replicas: 1
    domain: staging.internal.dev
    cpu_request: 50m
    memory_request: 64Mi
    memory_limit: 256Mi
  prod:
    config_branch: main
    # Production bắt buộc duyệt -> orchestrator mở PR, người đọc diff rồi merge.
    require_pr: true
    replicas: 3
    domain: prod.internal.dev
    cpu_request: 100m
    memory_request: 128Mi
    memory_limit: 512Mi
