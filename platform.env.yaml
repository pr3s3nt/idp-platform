git:
  org: pr3s3nt
  config_repo_pattern: idp-{app}-config
  default_branch: main
  app_repo_pattern: '{app}'
  platform_repo: pr3s3nt/idp-platform
  bot_can_bypass: true
  committer_name: idp-orchestrator-pr3s3nt[bot]
  committer_email: 311388152+idp-orchestrator-pr3s3nt[bot]@users.noreply.github.com
onboarding:
  state_configmap_pattern: idp-onboarding-{app}
  visibilities:
  - internal
  allowed_owners: []
  verify_timeout_seconds: 420
registry:
  host: ghcr.io
  path: ghcr.io/pr3s3nt
  pull_secret: registry-pull
kubernetes:
  state_namespace: cluster-state
  namespace_pattern: '{app}-{env}'
  storage_class: storage-class
  sha_record_dir: .platform
  fleet_namespace: fleet-local
  fleet_git_secret: ''
  cluster_domain: svc.cluster.local
ci:
  verify_runner_label: ubuntu-latest
  score_k8s_version: 0.15.0
  score_compose_version: 0.43.0
vault:
  operator_version: 1.5.0
  address: http://vault.vault.svc.cluster.local:8200
  namespace: ''
  skip_tls_verify: true
  ca_cert_secret: ''
  tls_server_name: ''
  kv_mount: kv
  kv_type: kv-v2
  path_template: apps/{application}/{environment}/{name}
  auth_mount: kubernetes
  auth_audience: vault
  auth_role_template: idp-{application}-{environment}
  policy_template: idp-{application}-{environment}
  service_account_template: idp-{application}
  token_ttl: 1h
  operator_namespace: vault-secrets-operator-system
  connection_name: default
  auth_global_name: default
  allowed_namespaces: []
  auth_ref: app-vault
  refresh_after: 5m
  initial_sync_timeout_seconds: 60
database:
  provider: cloudnative-pg
  operator_version: 0.29.0
  operator_namespace: cnpg-system
  image_repository: ghcr.io/cloudnative-pg/postgresql
  storage_class: ''
  credential_secret: database
  ready_timeout_seconds: 600
  backup:
    object_store_url: ''
    endpoint_url: ''
    credentials_secret: ''
    destination_path: ''
    schedule: 0 0 2 * * *
    first_backup_timeout_seconds: 600
database_profiles:
  staging:
    application:
      engine_version: '17'
      instances: 1
      storage: 10Gi
      cpu_request: 250m
      memory_request: 512Mi
      high_availability: false
      backup:
        enabled: true
        retention_days: 3
  prod:
    application:
      engine_version: '17'
      instances: 3
      storage: 100Gi
      cpu_request: '1'
      memory_request: 2Gi
      high_availability: true
      backup:
        enabled: true
        retention_days: 30
        point_in_time_recovery: true
features:
  application_values: true
  vault_secrets: true
  postgres_application: true
  stack_onboarding: true
ingress:
  gateway_name: ingress-gateway
  gateway_namespace: traefik
images:
  postgres: ghcr.io/pr3s3nt/postgres:17-alpine
  node: mirror.gcr.io/node:22-alpine
  nginx: mirror.gcr.io/nginx:1-alpine
environments:
  staging:
    config_branch: dev
    replicas: 1
    domain: staging.internal.dev
    cpu_request: 50m
    memory_request: 64Mi
    memory_limit: 256Mi
  prod:
    config_branch: main
    replicas: 3
    domain: prod.internal.dev
    cpu_request: 100m
    memory_request: 128Mi
    memory_limit: 512Mi
