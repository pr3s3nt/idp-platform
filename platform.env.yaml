# =============================================================================
# CẤU HÌNH MÔI TRƯỜNG — nơi DUY NHẤT chứa giá trị phụ thuộc hạ tầng.
#
# Chuyển platform sang môi trường khác = sửa file này. Không sửa code, không sửa
# provisioner, không sửa patch, không sửa workflow.
#
# KHÔNG ghim theo platform.lock, và đó là chủ ý. platform.lock ghim CATALOG — tức cách
# một resource được hiện thực hoá (route thành HTTPRoute, postgres thành StatefulSet).
# File này là TOẠ ĐỘ của hạ tầng đang chạy (gateway nào, storageclass nào). Nếu ghim nó
# theo lock, một app pin catalog cũ sẽ deploy vào tên Gateway đã bị đổi từ lâu — mà lỗi
# đó lại không báo gì, HTTPRoute chỉ đơn giản là không bao giờ được gắn vào.
#
# Cách dùng trong provisioner và patch: %%đường.dẫn.khoá%%
#   %%ingress.gateway_name%%     -> giá trị dùng chung
#   %%env.replicas%%             -> giá trị của môi trường ĐANG render (staging/prod)
#
# KHÔNG để bí mật ở đây. File này nằm trong git. Token, mật khẩu đi qua secret của CI.
# =============================================================================

git:
  org: pr3s3nt
  config_repo_pattern: "idp-{app}-config"
  default_branch: main
  # Bot có được phép bỏ qua branch protection không. Quyết định cách ghi vào repo cấu hình
  # cho những môi trường KHÔNG bắt duyệt: true -> push thẳng, false -> vẫn phải mở PR.
  bot_can_bypass: true
  # Danh tính ghi trên commit mà orchestrator tạo ra.
  # CẢNH BÁO: KHÔNG dùng đuôi @users.noreply.github.com. GitHub map đuôi đó về
  # username tương ứng, nên nếu username đó tồn tại thật thì mọi commit triển khai
  # sẽ bị ghi công cho một người lạ — đúng chuyện đã xảy ra với ci-bot@ ở sandbox.
  # Khi có GitHub App, đổi sang email chính thức của App đó.
  # Danh tính CHÍNH THỨC của GitHub App idp-orchestrator-pr3s3nt.
  # Đuôi @users.noreply.github.com ở đây là ĐÚNG — nó ánh xạ về chính con bot này.
  # Khác hẳn giá trị cũ ci-bot@users.noreply.github.com, vốn ánh xạ nhầm sang một
  # người dùng GitHub có thật, không liên quan gì tới dự án.
  committer_name: "idp-orchestrator-pr3s3nt[bot]"
  committer_email: "311388152+idp-orchestrator-pr3s3nt[bot]@users.noreply.github.com"

registry:
  # Host dùng cho docker login và cho imagePullSecret.
  host: ghcr.io
  # Tiền tố đầy đủ của ảnh: <path>/<image>:<tag>
  path: ghcr.io/pr3s3nt
  # Secret kiểu dockerconfigjson mà platform tự tạo trong mỗi namespace.
  pull_secret: registry-pull

kubernetes:
  # Namespace giữ trạng thái của bộ sinh manifest (một Secret cho mỗi app+env).
  state_namespace: cluster-state
  # Namespace của ứng dụng.
  namespace_pattern: "{app}-{env}"
  # Tên StorageClass mà provisioner có trạng thái (postgres) xin ổ đĩa.
  # SAI TÊN = PVC treo Pending vĩnh viễn, không có thông báo lỗi rõ ràng.
  storage_class: storage-class
  # Thư mục trong repo cấu hình ghi lại SHA đang deploy. Để ngoài staging/ và prod/
  # để Fleet không coi nó là manifest.
  sha_record_dir: .platform
  # Namespace chứa GitRepo của Fleet. Rancher thường dùng fleet-local cho cụm local và
  # fleet-default cho cụm downstream — khai SAI thì Fleet không nhận mà cũng không báo lỗi.
  fleet_namespace: fleet-local
  # Thông tin đăng nhập git để Fleet clone repo cấu hình TỪ TRONG cụm.
  # ĐỂ TRỐNG là mặc định nên dùng: platform sẽ học theo các GitRepo đang chạy cùng
  # namespace, và bỏ hẳn trường này nếu không có gì để học.
  # Khai cứng một tên chỉ đúng khi bạn CHẮC secret đó tồn tại — khai sai thì Fleet không
  # clone được, mà lỗi nằm trong status của GitRepo, không ai nhìn, và triệu chứng y hệt
  # "quên tạo GitRepo": cụm trống trơn trong khi manifest nằm đúng trong git.
  fleet_git_secret: ""
  # Hậu tố DNS nội bộ của cụm. Dùng để một app gọi service của app KHÁC
  # nằm ở namespace khác (xem resource type external-service).
  cluster_domain: svc.cluster.local

# ---------------------------------------------------------------------------
# Máy chạy CI. Nhãn KHÔNG đọc được từ file khi workflow tự khai `runs-on` —
# GitHub chọn máy trước khi chạy bước đầu tiên. Nhưng workflow verify nằm trong KHO
# CẤU HÌNH lại do platform sinh ra, nên nhãn của nó lấy được từ đây.
# ---------------------------------------------------------------------------
ci:
  # Nhãn máy chạy cho workflow verify trong kho cấu hình. Job đó chỉ gọi API GitHub —
  # không cần Docker, không cần vào cụm — nên dùng máy dùng chung là được, không phải
  # chiếm runner riêng của platform.
  # Một nhãn thì viết chuỗi; nhiều nhãn thì viết danh sách.
  verify_runner_label: ubuntu-latest

  # -------------------------------------------------------------------------
  # GHIM PHIÊN BẢN CÔNG CỤ RENDER
  #
  # score-k8s quyết định HÌNH DẠNG manifest sinh ra. Hai runner cài hai phiên bản khác
  # nhau thì cùng một commit app cho ra hai manifest khác nhau — và không có gì báo lỗi,
  # chỉ có một lần deploy tự nhiên thay đổi thứ không ai sửa. `preflight` gọi --version
  # và DỪNG nếu lệch, để sai lệch nổ ra trước khi render chứ không phải sau khi Fleet
  # đã apply.
  #
  # ĐỂ TRỐNG = tắt kiểm tra. Đó là mặc định tương thích ngược cho môi trường chưa kịp
  # đồng bộ runner; nhưng môi trường thật NÊN ghim.
  #
  # Giá trị dưới đây đã được xác minh trên harness WSL2 (score-k8s 0.15.0 / go1.26.4,
  # score-compose 0.43.0 / go1.26.5). Khi mang vào công ty: cài đúng hai phiên bản này
  # lên runner, HOẶC đổi hai dòng này cho khớp runner rồi chạy lại full test suite.
  score_k8s_version: "0.15.0"
  # score-compose chỉ cần cho luồng phát triển local (`make dev`) và cho CI của stack.
  # preflight của orchestrator KHÔNG bắt buộc có nó — xem --require-score-compose.
  score_compose_version: "0.43.0"

# ---------------------------------------------------------------------------
# HASHICORP VAULT — kho bí mật DUY NHẤT của platform.
#
# Platform KHÔNG BAO GIỜ đọc giá trị bí mật. Nó chỉ sinh metadata: một VaultStaticSecret
# nói "lấy đường dẫn X trong Vault, đổ vào Secret Y". Vault Secrets Operator (VSO) chạy
# trong cụm mới là thứ thực sự đọc Vault. Nhờ vậy CI không cần Vault token, và git chỉ
# chứa tham chiếu chứ không chứa giá trị.
#
# ĐƯỜNG DẪN VAULT LÀ DO PLATFORM SUY RA, KHÔNG PHẢI DO APP KHAI. App chỉ viết
# `secretRef: {name: stripe, key: api_key}`; platform ráp thành
# <kv_mount>/<path_template>. Nếu app tự khai được mount/path thì app A đọc được secret
# của app B chỉ bằng cách gõ đúng chuỗi — nên trường đó cố tình không tồn tại.
# ---------------------------------------------------------------------------
vault:
  # Phiên bản VSO (chart và app version của hashicorp/vault-secrets-operator trùng nhau).
  # CRD và controller phải nâng cấp CÙNG NHAU — lệch phiên bản thì CR mới bị controller cũ
  # bỏ qua trong im lặng. preflight so phiên bản operator đang chạy với giá trị này.
  operator_version: "1.5.0"
  # KV secrets engine. kv_type phải khớp cách mount thật; kv-v2 có version/metadata,
  # kv-v1 thì không, và VSO đọc hai loại bằng hai đường khác nhau.
  kv_mount: kv
  kv_type: kv-v2
  # Khuôn đường dẫn TRONG mount. {application}/{environment}/{name} là ranh giới phân
  # quyền: policy của một app chỉ cấp đọc trên tiền tố apps/<app>/<env>/*.
  path_template: "apps/{application}/{environment}/{name}"
  # Tên VaultAuth trong namespace của app mà mọi VaultStaticSecret trỏ tới.
  # KHÔNG dùng auth_global_ref trong VaultStaticSecret — object đó phải trỏ VaultAuth.
  auth_ref: app-vault
  # Chu kỳ VSO đọc lại Vault. Ngắn = xoay vòng nhanh, dài = ít tải lên Vault.
  refresh_after: 5m
  # Thời gian `verify` chờ VaultStaticSecret lần đầu Ready trước khi coi là hỏng.
  initial_sync_timeout_seconds: 60

# ---------------------------------------------------------------------------
# HỒ SƠ DATABASE — staging và prod dùng CÙNG contract, khác PROFILE.
#
# Đây là điểm mấu chốt: app chỉ khai `type: postgres, class: application` và nhận đúng
# một bộ output ở mọi môi trường. Thứ khác nhau giữa staging và prod nằm HẾT ở đây, do
# platform quản, app không nhìn thấy và không sửa được.
#
# engine_version PHẢI giống nhau giữa staging và prod. Khác major version nghĩa là
# staging không còn kiểm chứng được prod — đó là toàn bộ lý do tồn tại của staging.
# ---------------------------------------------------------------------------
database_profiles:
  staging:
    application:
      engine_version: "17"
      instances: 1
      storage: 10Gi
      cpu_request: 250m
      memory_request: 512Mi
      high_availability: false
      backup:
        enabled: true
        retention_days: 3
  prod:
    application:
      engine_version: "17"
      instances: 3
      storage: 100Gi
      cpu_request: "1"
      memory_request: 2Gi
      high_availability: true
      backup:
        enabled: true
        retention_days: 30
        point_in_time_recovery: true

# ---------------------------------------------------------------------------
# CỜ TÍNH NĂNG — mọi thứ mới đều TẮT mặc định.
#
# Nền tảng này đang chạy thật và đã deploy app lên staging. Mỗi tính năng dưới đây phải
# bật được từng cái một cho từng app, và tắt lại được mà không cần rollback platform.
# App không có .score-values/values.yaml giữ nguyên hành vi cũ dù cờ có bật hay không.
# ---------------------------------------------------------------------------
features:
  application_values: false
  vault_secrets: false
  postgres_application: false
  stack_onboarding: false

ingress:
  # PHẢI khớp chính xác Gateway đang chạy trên cụm. Sai tên hoặc sai namespace thì
  # HTTPRoute không bao giờ được attach — và không có lỗi ở đâu cả.
  gateway_name: ingress-gateway
  gateway_namespace: traefik

images:
  # Ảnh của các datastore do provisioner dựng. Trên môi trường thật, trỏ vào registry
  # nội bộ vì cụm thường không ra được internet.
  postgres: ghcr.io/pr3s3nt/postgres:17-alpine

# ---------------------------------------------------------------------------
# Khác biệt giữa các môi trường. Khi render, khối tương ứng được phơi ra dưới
# tiền tố `env.` — ví dụ %%env.replicas%%, %%env.domain%%.
# ---------------------------------------------------------------------------
environments:
  staging:
    # Mô hình hai nhánh, khớp cách công ty tổ chức: dev = staging, main = production.
    # Nhánh của repo cấu hình. CÓ CẦN DUYỆT HAY KHÔNG thì KHÔNG khai ở đây —
    # orchestrator hỏi thẳng branch protection của nhánh này. Một cờ trong file
    # và một cấu hình thật trên GitHub là hai nguồn sự thật, chắc chắn có lúc lệch.
    config_branch: dev
    replicas: 1
    domain: staging.internal.dev
    cpu_request: 50m
    memory_request: 64Mi
    memory_limit: 256Mi
  prod:
    config_branch: main
    replicas: 3
    domain: prod.internal.dev
    cpu_request: 100m
    memory_request: 128Mi
    memory_limit: 512Mi
