name: build-app

on:
  workflow_dispatch:
    inputs:
      app_repo:
        description: "App repository (e.g. org/app)"
        required: true
      sha:
        description: "Commit SHA to build"
        required: true
      ref:
        description: "Branch name"
        required: false
        default: main

env:
  # Registry host is a coordinate, so it comes from platform.env.yaml, never hardcoded here.
  PYTHON: ${{ vars.PYTHON_BIN || 'python3.12' }}

jobs:
  build:
    runs-on: [self-hosted, "${{ vars.RUNNER_LABEL || 'platform-orchestrator' }}"]
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.app_repo }}
          ref: ${{ inputs.sha }}
          path: app

      - name: Checkout platform
        uses: actions/checkout@v4
        with:
          path: platform

      - name: Lấy token cho bot
        id: app-token
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -n "${BOT_TOKEN:-}" ]; then
            echo "::add-mask::$BOT_TOKEN"
            echo "token=$BOT_TOKEN" >> "$GITHUB_OUTPUT"
          elif [ -n "${APP_ID:-}" ]; then
            platform/tools/mint-app-token.sh
          else
            echo "::error::chưa có BOT_TOKEN lẫn APP_ID"
            exit 1
          fi

      # Build tags come from the PLATFORM, not from a rule reinvented here. `image-plan`
      # (engine/render.py:plan_images) is "THE ONE PLACE that decides image names". Render
      # will reference exactly these refs; if CI tagged by any other rule (e.g. the commit
      # SHA) the mismatch is invisible until Fleet applies a manifest pointing at an image
      # nobody pushed — which is precisely the ImagePullBackOff we hit before. `--with-build`
      # also returns the build recipe (context + Dockerfile) from the catalog, so a monorepo
      # with a shared workspace package builds with the right context on the first run.
      - name: Build images from platform image-plan
        id: build
        run: |
          set -euo pipefail
          SHA="${{ inputs.sha }}"
          REPO_NAME=$(echo "${{ inputs.app_repo }}" | cut -d'/' -f2)
          REGISTRY=$($PYTHON platform/idpctl --env-config platform/platform.env.yaml \
            config --get registry.path)

          PLAN=$($PYTHON platform/idpctl --env-config platform/platform.env.yaml image-plan \
            --app "$REPO_NAME" --tag "$SHA" --registry "$REGISTRY" \
            --app-dir app --catalog platform --with-build)
          echo "$PLAN"

          echo "$PLAN" | $PYTHON - <<'PY'
          import json, subprocess, sys
          plan = json.load(sys.stdin)
          for wl, spec in plan.items():
              img = spec["image"]
              ctx = "app/" + spec["context"]
              df = "app/" + spec["dockerfile"]
              print(f"==> build {wl}: {img}  (context={ctx})", flush=True)
              subprocess.run(["docker", "build", "-f", df, "-t", img, ctx], check=True)
              subprocess.run(["docker", "push", img], check=True)
          PY

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "repo_name=$REPO_NAME" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy via repository_dispatch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          SHA="${{ steps.build.outputs.sha }}"
          REPO_NAME="${{ steps.build.outputs.repo_name }}"

          # Deploy toàn bộ app như 1 đơn vị (tất cả services trong cùng namespace)
          echo "==> Triggering deploy for $REPO_NAME via repository_dispatch"

          gh api repos/pr3s3nt/idp-platform/dispatches \
            -f event_type=deploy-request \
            -f client_payload[app]="$REPO_NAME" \
            -f client_payload[repo]="${{ inputs.app_repo }}" \
            -f client_payload[sha]="$SHA" \
            -f client_payload[env]=staging
